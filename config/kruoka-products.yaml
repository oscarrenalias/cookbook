# How shopping-list ingredients map onto K-Ruoka products.
#
# Used by the estimate-cost skill. Only ingredients that need help are listed;
# anything absent is searched by its own name, which works for items already
# written in Finnish and usually fails for English ones.
#
# Three levels of precision, each optional:
#   milk: maito                       # just a Finnish search term
#   crushed tomatoes:                 # ...plus a brand you prefer
#     query: tomaattimurska
#     brand: Mutti
#     exclude: [basilika]             # ...plus variants to skip
#     category: hedelmat-ja-vihannekset   # ...plus a category path substring
#   parmesan:
#     ean: "0000000000000"            # ...or pin one exact product
#
# Use `estimate-cost.py lookup <term> --brand <brand>` to check a term before
# adding it, and `estimate-cost.py coverage` to see what is still unmapped.

# Assumed already in the cupboard. Priced at 0 and listed separately, unless
# --include-pantry is passed. These appear on nearly every list because the
# recipes declare them, not because they are rebought weekly.
pantry:
  - salt
  - black pepper
  - olive oil
  - neutral oil
  - sugar
  - paprika
  - smoked paprika
  - dried oregano
  - dried dill
  - dried thyme
  - ground cumin
  - chili flakes
  - chili powder
  - bay leaf
  - cinnamon
  - turmeric
  - curry powder
  - vinegar
  - brown sugar
  - ground turmeric
  - dried rosemary
  - cumin seeds
  - coriander seeds

# Never real purchases.
  - ground nutmeg
  - dried basil
  - dried parsley
  - kashmiri chilli powder
  - garam masala
skip:
  - water
  - warm water
  - cold water
  - pasta cooking water
  - ice
  - dinner
  - soap for pool

